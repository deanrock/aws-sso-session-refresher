name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          gh release create "$TAG" SSORefresher.zip \
            --title "$TAG" \
            --notes "Built from commit ${GITHUB_SHA}"
